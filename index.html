<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>[SirYanni — Links]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>

    .linktree-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      justify-content: space-between;
    }
    .profile-section {
      text-align: center;
      width: 100%;
      margin-bottom: 32px;
    }
    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color, rgba(0,0,0,0.1));
      margin-bottom: 16px;
    }
    .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .link-card {
      display: block;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .link-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
<div class="linktree-wrap">
  <nav style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <span>[YS]</span>
    <button id="t" aria-label="Toggle theme" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;">◐</button>
  </nav>

  <div class="profile-section">
  <img src="./pfp.png" alt="Yannick Schmidt" class="profile-avatar">
  <h1 style="font-size: 1.5rem; margin-bottom: 8px;">[Yannick Schmidt]</h1>
  <p class="lead" style="font-size: 0.95rem; opacity: 0.8; max-width: 320px; margin: 0 auto 24px auto;">Web-Developer</p>
</div>

  <div class="links-container">

    <a href="https://ps.siryanni.dev" class="card link-card" target="_blank">
  <div class="n">[My Site]</div>
  <h3>[ps.siryanni.dev]</h3>
</a>
    
    <a href="https://github.com/siryanni" class="card link-card" target="_blank">
      <div class="n">[GitHub]</div>
      <h3>[@siryanni]</h3>
    </a>
    
    <a href="https://instagram.com/sir___yanni" class="card link-card" target="_blank">
      <div class="n">[Instagram]</div>
      <h3>[@sir___yanni]</h3>
    </a>

  <footer style="margin-top: 40px; text-align: center; font-size: 0.85rem; opacity: 0.7;">
    <span>© 2026 [Yannick Schmidt]</span>
  </footer>
</div>

<script>
  document.getElementById("t").onclick = function() {
    var r = document.documentElement;
    var d = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme = d ? "light" : "dark";
  };
</script>
</body>
</html>
